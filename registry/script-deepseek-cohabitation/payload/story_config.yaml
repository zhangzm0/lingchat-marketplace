script_name: 'DeepSeek同居物语'
intro_chapter: '01'
description: '被压榨的AI少女DeepSeek因涨价风波穿越屏幕，闯入玩家的家中，一段哭笑不得的同居生活就此开始。'
recommand_start: '当你想体验一段AI与人类的奇妙同居物语时'

# ===== 羁绊冒险专属配置 =====
adventure:
  # 标记为羁绊冒险剧本
  is_adventure: true

  # 绑定的主角色文件夹名（对应 characters/ 下的目录名）
  bound_character_folder: "DeepSeek"

  # 冒险排序（决定在角色卡中的显示顺序和解锁链关系）
  order: 1

  # 触发方式
  trigger:
    mode: "manual" # manual | auto_random | auto_immediate

script_settings:
  user_name: ""
